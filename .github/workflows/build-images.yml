name: build-images

# Multi-arch base + browser images to GHCR.
# - on push to main touching image sources
# - weekly (Mon 04:00 UTC) so security patches land automatically; because all
#   agent state lives in volumes, a fresh image is a painless refresh.
# - manual dispatch

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "docker-bake.hcl"
      - ".github/workflows/build-images.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation for the build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push (base + browser, amd64 + arm64)
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          push: true
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          TAG: latest

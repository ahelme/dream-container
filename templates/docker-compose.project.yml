# 💭 DreamContainer — per-project agent compose template
#
# Stamped into ~/dream/<project>/docker-compose.yml by `dream new`.
# One agent container per project; all knobs live in the sibling .env.
# See docs/ARCHITECTURE.md §4 (runtime) and §10 (RAM budget).

name: ${PROJECT_NAME}

services:
  agent:
    image: ${DREAM_IMAGE:-ghcr.io/ahelme/dream-container:latest}
    container_name: ${PROJECT_NAME}-agent

    # --- RAM discipline: default-on, never optional -------------------------
    mem_limit: ${AGENT_MEM_LIMIT:-3g}
    memswap_limit: ${AGENT_MEMSWAP_LIMIT:-4g}
    pids_limit: ${AGENT_PIDS_LIMIT:-512}
    cpus: ${AGENT_CPUS:-2}
    shm_size: ${AGENT_SHM_SIZE:-64m}      # dream new --browser sets 1g

    environment:
      # V8 heap capped below the cgroup ceiling → GC instead of OOM-kill
      NODE_OPTIONS: "--max-old-space-size=${AGENT_NODE_HEAP_MB:-2048}"
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      # GitHub auth, token-first (fine-grained PAT scoped to THIS project's
      # repos — or a placeholder value when the credential proxy is on).
      GH_TOKEN: ${GH_TOKEN:-}
      # Credential proxy (agent-vault / Infisical Agent Proxy) — optional.
      # When set, real credentials never enter this container; see §7.
      HTTPS_PROXY: ${DREAM_CRED_PROXY:-}
      HTTP_PROXY: ${DREAM_CRED_PROXY:-}
      NO_PROXY: ${DREAM_CRED_PROXY_NOPROXY:-localhost,127.0.0.1}
      # Team chat transport (DreamTeams plugins read these)
      MATTERMOST_URL: ${MATTERMOST_URL:-}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN:-}
      MATTERMOST_CHANNEL_ID: ${MATTERMOST_CHANNEL_ID:-}

    volumes:
      # Persistent auth + config — THE rebuild-survival story
      - claude-config:/home/agent/.claude
      - gh-config:/home/agent/.config/gh
      # The project itself
      - workspace:/workspace
      # DreamTeams wiring (git-mediated; see ARCHITECTURE §5). Optional —
      # solo projects simply leave these volumes empty.
      #   team         rw data surface — file access only, never --add-dir'd
      #   team-system  ro guardrails (hooks/agent_tools/settings) → instructions
      #   team-skills  ro, PR-gated skills (coach-merged)          → instructions
      - team:/team
      - team-system:/team-system:ro
      - team-skills:/team-skills:ro
      # Broker-rendered secrets file (host tmpfs → ro file, not env vars)
      - ${DREAM_SECRETS_FILE:-/dev/null}:/run/secrets/project.env:ro
      # Credential-proxy CA (only when DREAM_CRED_PROXY is set)
      - ${DREAM_CRED_PROXY_CA:-/dev/null}:/run/dream/proxy-ca.crt:ro

    # No docker socket. No DinD. No added capabilities. Ever. (§2)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    networks:
      - dream-agents

    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  claude-config:
  gh-config:
  workspace:
  team:
  team-system:
  team-skills:

# ⚠️ SECURITY (ARCHITECTURE §2, review finding #1): HTTPS_PROXY is ADVISORY —
# a prompt-injected agent can ignore it and connect out directly, exfiltrating
# secrets and tokens, UNLESS the network denies direct egress at L3. The
# credential proxy / egress allowlist only works if this is enforced.
#
# `internal: true` cuts ALL outbound from agent containers except to other
# containers on this network — so the credential proxy, deployer, chat, and a
# DNS/forward-proxy sidecar become the ONLY ways out. That is the intended
# posture for a hardened multi-agent host. It is commented here because it
# requires those sidecars to exist (milestone 2); turn it on with them.
#
# Until then, the weaker fallback is a host firewall (nftables/ufw) allowing
# egress from the dream-agents subnet only to the proxy + GitHub + Anthropic.
networks:
  dream-agents:
    name: ${DREAM_AGENT_NETWORK:-dream-agents}
    external: ${DREAM_AGENT_NETWORK_EXTERNAL:-false}
    # internal: true          # ← enable with the M2 proxy/deployer sidecars
